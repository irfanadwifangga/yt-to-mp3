# Konfigurasi rilis. Lihat docs planning §25.
#
# Validasi lokal (butuh goreleaser v2):
#   goreleaser check
#   goreleaser release --snapshot --clean
version: 2

project_name: yt-to-mp3

before:
  hooks:
    # SPA disematkan ke binary lewat go:embed, jadi harus sudah di-build
    # sebelum go build. Tanpa langkah ini binary rilis hanya menyajikan
    # halaman petunjuk "SPA belum di-build".
    - npm --prefix web ci
    - npm --prefix web run check:i18n
    - npm --prefix web run build

builds:
  - id: yt-to-mp3
    main: ./cmd/app
    binary: yt-to-mp3
    env:
      # Seluruh dependensi wajib pure Go supaya cross-compile tidak butuh
      # toolchain C (ADR-011).
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/irfanadwifangga/yt-to-mp3/internal/version.Version={{ .Version }}
      - -X github.com/irfanadwifangga/yt-to-mp3/internal/version.Commit={{ .ShortCommit }}
    goos: [windows, linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      # Tidak ada entri manifest tool untuk windows/arm64, jadi tool tidak
      # bisa dipasang dari aplikasi di sana.
      - goos: windows
        goarch: arm64

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  # Rilis dibuat sebagai draft: binary belum ditandatangani, dan catatan
  # rilis perlu ditinjau manusia sebelum terlihat publik.
  draft: true
  prerelease: auto
  footer: |
    Binary belum ditandatangani. Di Windows, SmartScreen dapat menampilkan
    peringatan; pilih "More info" lalu "Run anyway". Di macOS, jalankan
    `xattr -d com.apple.quarantine ./yt-to-mp3` setelah mengekstrak.
    Cocokkan unduhan dengan `checksums.txt` sebelum menjalankannya.
