# Konfigurasi rilis. Lihat docs planning §25.
#
# Validasi lokal (butuh goreleaser v2):
#   goreleaser check
#   goreleaser release --snapshot --clean
version: 2

project_name: yt-to-mp3

before:
  hooks:
    # SPA disematkan ke binary lewat go:embed, jadi harus sudah di-build
    # sebelum go build. Tanpa langkah ini binary rilis hanya menyajikan
    # halaman petunjuk "SPA belum di-build".
    - npm --prefix web ci
    - npm --prefix web run check:i18n
    - npm --prefix web run build

builds:
  - id: yt-to-mp3
    main: ./cmd/app
    binary: yt-to-mp3
    env:
      # Seluruh dependensi wajib pure Go supaya cross-compile tidak butuh
      # toolchain C (ADR-011).
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/irfanadwifangga/yt-to-mp3/internal/version.Version={{ .Version }}
      - -X github.com/irfanadwifangga/yt-to-mp3/internal/version.Commit={{ .ShortCommit }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

  # Windows dipisah karena dua hal yang tidak berlaku di OS lain: subsystem
  # GUI supaya tidak ada jendela console saat dibuka dari Start Menu, dan
  # resource berisi ikon, info versi, serta manifest. windows/arm64 tidak
  # dibangun karena manifest tool tidak punya entri untuknya.
  - id: yt-to-mp3-windows
    main: ./cmd/app
    binary: yt-to-mp3
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -H windowsgui
      - -X github.com/irfanadwifangga/yt-to-mp3/internal/version.Version={{ .Version }}
      - -X github.com/irfanadwifangga/yt-to-mp3/internal/version.Commit={{ .ShortCommit }}
    goos: [windows]
    goarch: [amd64]
    hooks:
      pre:
        # Berkas .syso bernama *_windows_amd64 hanya ikut di-link untuk
        # target itu. Tidak di-commit karena versinya berubah setiap rilis.
        - cmd: >-
            go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0
            -64 -o cmd/app/resource_windows_amd64.syso
            -icon packaging/windows/yt-to-mp3.ico
            -manifest packaging/windows/yt-to-mp3.exe.manifest
            -file-version {{ .Version }} -product-version {{ .Version }}
            -ver-major {{ .Major }} -ver-minor {{ .Minor }} -ver-patch {{ .Patch }} -ver-build 0
            -product-ver-major {{ .Major }} -product-ver-minor {{ .Minor }} -product-ver-patch {{ .Patch }} -product-ver-build 0
            packaging/windows/versioninfo.json

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  # Rilis dibuat sebagai draft: binary belum ditandatangani, dan catatan
  # rilis perlu ditinjau manusia sebelum terlihat publik.
  draft: true
  prerelease: auto
  footer: |
    Windows users only need `yt-to-mp3_<version>_windows_amd64_setup.exe`;
    the Windows zip is for portable use.

    Binaries are not signed yet. On Windows, SmartScreen may show a warning;
    choose "More info" and then "Run anyway". On macOS, run
    `xattr -d com.apple.quarantine ./yt-to-mp3` after extracting.
    Verify downloads against `checksums.txt` before running them.
