<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Tanda merek yang sama dengan .brand-mark dan ikon Windows (scripts/icon). -->
  <clipPath id="mark">
    <rect x="1" y="1" width="14" height="14" rx="2.4" />
  </clipPath>
  <g clip-path="url(#mark)">
    <rect x="1" y="1" width="14" height="6.3" fill="#6f7a73" />
    <rect x="1" y="7.3" width="14" height="7.7" fill="#2e7d55" />
  </g>
</svg>
