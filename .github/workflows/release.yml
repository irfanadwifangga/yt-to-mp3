name: Rilis

# Tag v* membuat rilis GitHub berstatus draft beserta arsip lima target dan
# checksums.txt. Tidak ada yang terlihat publik sampai draft itu diterbitkan
# manual. Pemicu manual menjalankan snapshot: seluruh arsip dibangun dan
# diunggah sebagai artifact workflow tanpa membuat rilis, untuk memvalidasi
# konfigurasi GoReleaser sebelum tag pertama.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "24"

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      # Hanya dibutuhkan untuk membuat draft rilis dari tag.
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Changelog dan versi dibaca dari riwayat tag.
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: ${{ startsWith(github.ref, 'refs/tags/') && 'release --clean' || 'release --snapshot --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v6
        with:
          name: snapshot
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/checksums.txt
          retention-days: 7
