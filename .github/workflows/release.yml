name: Release

# A v* tag creates a draft GitHub release with archives for five targets,
# checksums.txt, and the Windows installer. Nothing is public until the draft
# is published by hand. A manual run builds a snapshot instead: everything is
# uploaded as workflow artifacts without creating a release, to validate the
# pipeline before tagging.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "24"

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      # Only needed to create the draft release from a tag.
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # The changelog and version are read from the tag history.
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: ${{ startsWith(github.ref, 'refs/tags/') && 'release --clean' || 'release --snapshot --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # metadata.json carries the version GoReleaser used, including snapshot
      # versions, so artifact names match the files inside them.
      - name: Read version
        run: echo "APP_VERSION=$(jq -r .version dist/metadata.json)" >> "$GITHUB_ENV"
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v6
        with:
          name: yt-to-mp3_${{ env.APP_VERSION }}_archives
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/checksums.txt
          retention-days: 7
      # Hands the Windows binary to the installer job.
      - uses: actions/upload-artifact@v6
        with:
          name: windows-build
          path: |
            dist/*_windows_amd64.zip
            dist/metadata.json
          retention-days: 1

  installer:
    name: Windows installer
    needs: goreleaser
    runs-on: windows-latest
    permissions:
      # Only needed to upload the installer to the draft release from a tag.
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: windows-build
          path: dist
      - name: Extract binary and read version
        shell: pwsh
        run: |
          $meta = Get-Content dist/metadata.json | ConvertFrom-Json
          $zip = Get-ChildItem dist -Filter "*_windows_amd64.zip" | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath build/windows -Force
          Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=$($meta.version)"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DSourceExe=$PWD\build\windows\yt-to-mp3.exe" "/O$PWD\dist" packaging\windows\yt-to-mp3.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Get-ChildItem dist -Filter "*_setup.exe" | Select-Object -First 1
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$($setup.FullName).sha256" -Value "$hash  $($setup.Name)" -Encoding ascii
          Add-Content -Path $env:GITHUB_ENV -Value "SETUP_PATH=$($setup.FullName)"
      - if: ${{ startsWith(github.ref, 'refs/tags/') }}
        name: Upload to draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "$env:SETUP_PATH" "$env:SETUP_PATH.sha256" --clobber
      # GitHub always serves workflow artifacts as a zip named after the
      # artifact, so the name mirrors the installer file inside it.
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v6
        with:
          name: yt-to-mp3_${{ env.APP_VERSION }}_windows_amd64_setup
          path: dist/*_setup.exe*
          retention-days: 7
