name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "24"

jobs:
  web:
    name: Build SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run typecheck
      - run: npm --prefix web test
      - run: npm --prefix web run check:i18n
      - run: npm --prefix web run build
      - uses: actions/upload-artifact@v6
        with:
          name: spa-dist
          path: web/dist
          retention-days: 1

  check:
    name: Lint and test Go
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/download-artifact@v7
        with:
          name: spa-dist
          path: web/dist
      - name: Check formatting
        run: |
          out=$(gofmt -l ./cmd ./internal ./scripts ./web)
          if [ -n "$out" ]; then echo "not formatted:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...
      # Integration tests use a real FFmpeg with synthetic fixtures.
      # YT2MP3_REQUIRE_TOOLS makes the tests fail instead of skipping when
      # ffmpeg is missing, so CI never passes without testing anything.
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: FFmpeg integration and E2E pipeline tests
        env:
          YT2MP3_REQUIRE_TOOLS: "1"
        run: go test -tags integration -run "Integrasi|E2E" -v ./internal/infrastructure/ffmpeg/ ./internal/e2e/

  test-os:
    name: Test Go ${{ matrix.os }}
    needs: web
    strategy:
      fail-fast: false
      matrix:
        # Linux is already tested with -race in the check job. Windows and
        # macOS run separately because process tree termination and atomic
        # rename are implemented per OS, and the acceptance criteria require
        # cancellation to be proven to clean up the whole tree on Windows.
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/download-artifact@v7
        with:
          name: spa-dist
          path: web/dist
      # No -race: the race detector needs cgo, while this project builds
      # with CGO_ENABLED=0.
      - run: go test ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/download-artifact@v7
        with:
          name: spa-dist
          path: web/dist
      # CGO_ENABLED=0 is set explicitly: every dependency must be pure Go so
      # cross-compiling never needs a C toolchain. See ADR-011.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="yt-to-mp3_${GOOS}_${GOARCH}"
          if [ "$GOOS" = "windows" ]; then out="${out}.exe"; fi
          go build -trimpath -ldflags "-s -w" -o "bin/${out}" ./cmd/app
      - uses: actions/upload-artifact@v6
        with:
          name: yt-to-mp3_${{ matrix.goos }}_${{ matrix.goarch }}
          path: bin/
          retention-days: 7

  smoke:
    name: Smoke test ${{ matrix.os }}
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/download-artifact@v7
        with:
          name: spa-dist
          path: web/dist
      - name: Build and print version
        run: go run ./cmd/app -version
