name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "24"

jobs:
  web:
    name: Build SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run check:i18n
      - run: npm --prefix web run build
      - uses: actions/upload-artifact@v4
        with:
          name: spa-dist
          path: web/dist
          retention-days: 1

  check:
    name: Lint dan test Go
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: spa-dist
          path: web/dist
      - name: Periksa format
        run: |
          out=$(gofmt -l ./cmd ./internal ./scripts ./web)
          if [ -n "$out" ]; then echo "belum diformat:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...
      # Test integrasi memakai FFmpeg sungguhan dengan fixture sintetis.
      # YT2MP3_REQUIRE_TOOLS membuat test gagal alih-alih dilewati bila
      # ffmpeg tidak ditemukan, supaya CI tidak hijau tanpa menguji apa pun.
      - name: Pasang FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Test integrasi FFmpeg dan E2E pipeline
        env:
          YT2MP3_REQUIRE_TOOLS: "1"
        run: go test -tags integration -run "Integrasi|E2E" -v ./internal/infrastructure/ffmpeg/ ./internal/e2e/

  test-os:
    name: Test Go ${{ matrix.os }}
    needs: web
    strategy:
      fail-fast: false
      matrix:
        # Linux sudah diuji dengan -race di job check. Windows dan macOS
        # diuji terpisah karena terminasi process tree dan rename atomik
        # punya implementasi berbeda per OS; acceptance criteria menuntut
        # cancel terbukti membersihkan seluruh tree di Windows.
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: spa-dist
          path: web/dist
      # Tanpa -race: detektor race butuh cgo, sedangkan build proyek ini
      # dijaga CGO_ENABLED=0.
      - run: go test ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: spa-dist
          path: web/dist
      # CGO_ENABLED=0 dijaga eksplisit: seluruh dependensi wajib pure Go
      # supaya cross-compile tidak perlu toolchain C. Lihat ADR-011.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="yt-to-mp3_${GOOS}_${GOARCH}"
          if [ "$GOOS" = "windows" ]; then out="${out}.exe"; fi
          go build -trimpath -ldflags "-s -w" -o "bin/${out}" ./cmd/app
      - uses: actions/upload-artifact@v4
        with:
          name: yt-to-mp3_${{ matrix.goos }}_${{ matrix.goarch }}
          path: bin/
          retention-days: 7

  smoke:
    name: Smoke test ${{ matrix.os }}
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: spa-dist
          path: web/dist
      - name: Build dan cek versi
        run: go run ./cmd/app -version
