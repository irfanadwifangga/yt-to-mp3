name: Tool regression

# Bumping yt-dlp or FFmpeg can break conversions without a single line of
# code changing. This workflow installs the tools exactly as pinned in the
# manifest on every release OS, then runs the FFmpeg integration tests with
# those installed binaries. The weekly schedule catches upstream URLs that
# disappear or change content even when the manifest is untouched.

on:
  push:
    branches: [main]
    paths:
      - internal/infrastructure/tools/**
      - internal/infrastructure/ffmpeg/**
      - .github/workflows/tools-regression.yml
  pull_request:
    paths:
      - internal/infrastructure/tools/**
      - internal/infrastructure/ffmpeg/**
      - .github/workflows/tools-regression.yml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.27"

jobs:
  install-and-convert:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64 and macos-15-intel is amd64; each has its own
        # manifest entry.
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      YT2MP3_TEST_TOOLS_DIR: ${{ github.workspace }}/.tools-test
      YT2MP3_REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install tools from manifest
        run: go test -tags toolinstall -run TestInstallDariManifest -v ./internal/infrastructure/tools/
      - name: Convert with installed tools
        run: go test -tags integration -run Integrasi -v ./internal/infrastructure/ffmpeg/
